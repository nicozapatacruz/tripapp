name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Ojo: el ID de cada publicación en Pages es el SHA del commit. Si una publicación
  # queda trabada (pasó el 5 nov 2026 durante una falla de GitHub Actions), reintentar
  # o usar "Run workflow" sobre el MISMO commit falla siempre ("Timeout reached" o
  # "Deployment cancelled"). Se arregla con un commit nuevo que no sea solo de .md
  # (los cambios solo de .md no disparan el deploy, ver paths-ignore).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
